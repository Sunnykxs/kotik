<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Котики</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }
        header {
            position: fixed;
            width: 100%;
            background: #eee;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-sizing: border-box;
        }
        a {
            text-decoration: none;
            background: #007bff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .page {
            height: 100vh;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .box {
            width: 300px;
            height: 220px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bottom {
            align-items: flex-end;
        }
        img {
            max-width: 50%;
            max-height: 50%;
        }
        @media (max-width: 480px) {
            a { flex: 1; text-align: center; }
            .box { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">Страница 1</a>
        <a href="index2.html">Страница 2</a>
    </header>
    <div id="p2" class="page">
        <p>Текст сверху, котик по центру</p>
        <div class="box"><img src="https://free-png.ru/wp-content/uploads/2021/05/free-png.ru-383.png" alt="Котик"></div>
    </div>
</body>
</html>
