<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Котики</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }
        header {
            position: fixed;
            width: 100%;
            background: #eee;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-sizing: border-box;
        }
        a {
            text-decoration: none;
            background: #007bff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
        }
        p{
            z-index: 111;
        }
        .page {
            height: 100vh;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .box {
            width: 300px;
            height: 220px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .bottom {
            align-items: flex-end;
        }
        img {
            max-width: 50%;
            max-height: 50%;
        }
        .randombox1{
            height: 150px;
            width: 170px;
            position: absolute;
            margin-left: 270px;
            margin-bottom: 250px;
            border: 1px solid #ccc;
            z-index: 10;
        }
        .randombox2{
            height: 150px;
            width: 170px;
            position: absolute;
            margin-right: 270px;
            margin-top: 250px;
            border: 1px solid #ccc;
            z-index: 10;
        }
        @media (max-width: 480px) {
            a { flex: 1; text-align: center; }
            .box { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">Страница 1</a>
        <a href="index2.html">Страница 2</a>
    </header>
    <div id="p1" class="page">
        <div class="randombox1">
            <img src="https://free-png.ru/wp-content/uploads/2021/05/free-png.ru-375.png" alt="Котик">
        </div>
        <div class="randombox2">
            <img src="https://free-png.ru/wp-content/uploads/2021/05/free-png.ru-375.png" alt="Котик">
        </div>
        <div class="box bottom"><img src="https://free-png.ru/wp-content/uploads/2021/05/free-png.ru-375.png" alt="Котик"></div>
        <p>Котик прижат к низу, текст снизу</p>
    </div>
</body>
</html>
